<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园学习待办</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="card">
    <header>
      <p class="eyebrow">学习，从一件小事开始</p>
      <h1>校园学习待办</h1>
      <p class="intro">记下学习任务，一项一项慢慢完成。</p>
    </header>

    <form id="task-form" novalidate>
      <label for="task-input">新的学习任务</label>
      <div class="input-row">
        <input id="task-input" type="text" maxlength="200"
          placeholder="例如：完成高数作业" autocomplete="off"
          aria-describedby="input-error">
        <button class="add-button" type="submit">添加任务</button>
      </div>
      <p id="input-error" class="error" role="alert" hidden></p>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="筛选任务">
        <button type="button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </div>
      <p id="task-count" role="status">还有 0 项未完成</p>
    </div>

    <ul id="task-list" aria-label="学习任务列表"></ul>
    <p id="empty-state" class="empty-state">还没有任务，添加一项学习计划吧。</p>
    <p id="storage-message" class="error" role="status" hidden></p>
    <footer>任务保存在当前浏览器中</footer>
    <noscript><p class="error">请启用浏览器的 JavaScript，以使用待办清单。</p></noscript>
  </main>
</body>
</html>
